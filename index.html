<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeRoCon Lab — Procurement &amp; Inventory System</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="gate"></div>

  <div id="shell" class="shell hidden">
    <header class="top">
      <div class="brand">
        <img src="assets/logo.png" alt="WeRoCon Lab logo">
        <div>
          <b>WeRoCon Lab — Procurement &amp; Inventory System</b>
          <small>Automatic purchasing, documentation &amp; stock control</small>
        </div>
      </div>
      <div class="user">
        <span id="role-label"></span>
        <button class="btn" onclick="logout()">Log out</button>
      </div>
    </header>

    <nav class="nav">
      <button class="on" data-tab="dashboard">Overview</button>
      <button data-tab="add">Enter component</button>
      <button data-tab="documents">Documents</button>
      <button data-tab="tracking">Shipment tracking</button>
      <button data-tab="inventory">Inventory</button>
    </nav>

    <main class="main" id="app"></main>
  </div>

  <div class="toast" id="toast"></div>
  <div id="modal-host"></div>

  <!-- vendored libraries (no CDN dependency, works fully offline / on GitHub Pages) -->
  <script src="js/supabase.js"></script>
  <script src="js/docx.iife.js"></script>
  <script src="js/jszip.min.js"></script>

  <!-- app modules -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/docgen.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
