<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeRoCon Lab — Procurement & Inventory System</title>
<style>
.avatar{width:38px!important;height:38px!important;border-radius:50%!important;object-fit:cover!important;border:2px solid #dfe5ff!important;background:#fff!important}.editinput{min-width:105px;border:1px solid #dfe3eb;border-radius:7px;padding:6px;background:#fff}.checkrow{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0}.checkrow label{font-weight:700;font-size:12px}.exact-form{font-family:"Times New Roman",serif;color:#000}.exact-form .dochead{border:0}.exact-form table{table-layout:fixed}.exact-form p{line-height:1.35}
:root{--navy:#091744;--blue:#315be8;--ink:#182033;--muted:#6d7486;--line:#e5e8ef;--bg:#f5f7fb;--green:#16865c;--amber:#b86b12}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.shell{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:13px}.brand img{width:54px;height:48px;object-fit:contain}.brand b{display:block;color:var(--navy);font-size:17px}.brand small{color:var(--muted)}.user{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e9edff;color:var(--blue);display:grid;place-items:center;font-weight:800}.nav{height:48px;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:8px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:0 12px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}.nav button.on{color:var(--blue);border-color:var(--blue);font-weight:700}.main{max-width:1240px;margin:auto;padding:28px}.hero{background:linear-gradient(120deg,#0a194d,#273d8f);color:#fff;border-radius:18px;padding:25px 28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;box-shadow:0 10px 30px #16245c24}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:#cad2f2}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:650;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:#fff;color:var(--navy);border:0}.btn.green{background:var(--green);color:#fff;border:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px #18203308}.metric b{font-size:25px;color:var(--navy)}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.section{margin-top:18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.head h2{font-size:16px;margin:0;color:var(--navy)}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);background:#f9fafc;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.tablewrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff}.pill{padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750;display:inline-block}.green{background:#e5f6ef;color:#08724a}.amber{background:#fff0d9;color:#96540a}.blue{background:#e9edff;color:#294bc0}.gray{background:#eef0f4;color:#5e6574}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.steps{display:grid;gap:11px}.step{display:grid;grid-template-columns:38px 1fr auto;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.num{width:34px;height:34px;border-radius:10px;background:#edf0ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.step h3{font-size:13px;margin:0 0 3px}.step p{font-size:11px;color:var(--muted);margin:0}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#596071}.field input,.field select,.field textarea{border:1px solid #dfe3eb;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:68px;resize:vertical}.drop{border:1.5px dashed #bdc5d9;border-radius:10px;padding:13px;text-align:center;background:#fafbfe;color:var(--muted)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.hidden{display:none!important}.notice{background:#edf6ff;border:1px solid #cfe4fa;color:#225d8e;padding:11px 13px;border-radius:10px;font-size:11px}.doc{background:#fff;border:1px solid #d9dce4;box-shadow:0 10px 25px #17203c12;padding:34px;max-width:920px;margin:0 auto}.dochead{text-align:center;border-bottom:2px solid #1c2552;padding-bottom:12px}.dochead img{width:68px;height:58px;object-fit:contain;float:left}.doc h2{margin:2px 0;font-size:16px}.doc h3{margin:3px 0;font-size:13px}.doc p,.doc td,.doc th{font-size:10px}.doc table{border:1px solid #888;margin-top:12px}.doc td,.doc th{border:1px solid #999;padding:6px}.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:35px}.sig div{border-top:1px solid #777;padding-top:6px;font-size:10px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.toast{position:fixed;right:20px;bottom:20px;background:#10204f;color:#fff;padding:11px 15px;border-radius:9px;display:none;z-index:30}.rolebar{display:flex;gap:8px;align-items:center}.modal{position:fixed;inset:0;background:#09112c99;display:none;place-items:center;z-index:20;padding:20px}.modal.open{display:grid}.modalbox{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:22px;max-height:90vh;overflow:auto}.modalbox h2{margin-top:0;color:var(--navy)}@media(max-width:800px){.cards,.grid2,.formgrid{grid-template-columns:1fr}.main{padding:16px}.hero{align-items:flex-start;gap:18px;flex-direction:column}.top{padding:8px 14px}.brand small{display:none}.doc{padding:18px}.sig{gap:12px}.rolebar span{display:none}}@media print{.top,.nav,.hero,.tabs,.actions,.head,.notice{display:none!important}.main{padding:0}.doc{box-shadow:none;border:0;max-width:none}.section{margin:0}body{background:#fff}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="logo.png" alt="WeRoCon Lab logo"><div><b>WeRoCon Lab — Procurement &amp; Inventory System</b><small>Automatic purchasing, documentation &amp; stock control</small></div></div><div class="rolebar"><span id="roleLabel">Lab administrator</span><select id="role" onchange="setRole(this.value)"><option>Lab administrator</option><option>Professor / PI</option><option>Inventory manager</option></select><div class="avatar">WL</div></div></header><nav class="nav" id="nav"><button class="on" data-page="dashboard">Overview</button><button data-page="purchase">New purchase</button><button data-page="documents">Documents</button><button data-page="tracking">Shipment tracking</button><button data-page="inventory">Inventory</button></nav><main class="main" id="app"></main></div><div class="toast" id="toast"></div>
<div class="modal" id="trackModal"><div class="modalbox"><h2>Update shipment</h2><div class="formgrid"><div class="field"><label>Purchase</label><select id="trackPurchase"></select></div><div class="field"><label>Courier</label><select id="courier"><option>Blue Dart</option><option>Delhivery</option><option>DTDC</option><option>India Post</option><option>FedEx</option><option>Other</option></select></div><div class="field"><label>Tracking ID</label><input id="trackingId"></div><div class="field"><label>Status</label><select id="trackStatus"><option>Order placed</option><option>Picked up</option><option>In transit</option><option>Out for delivery</option><option>Delivered</option></select></div><div class="field"><label>Expected delivery</label><input type="date" id="expected"></div></div><div class="actions"><button class="btn" onclick="closeTrack()">Cancel</button><button class="btn primary" onclick="saveTrack()">Save tracking</button></div></div></div>
<script>
const KEY='werocon-procurement-v2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{purchases:[{id:'PR-2026-001',pi:'Prof. Sample PI',project:'Wearable Robotics Control',projectNo:'IITJ/R&D/WR-01',type:'Non Recurring (NR)',item:'Precision actuator assembly',qty:2,unit:18500,vendor:'Bharat Motion Systems',status:'Documents pending',gem:'Non-GeM',quotation:'quotation-actuator.pdf',receipt:'',certificate:'non-gem-certificate.pdf',tracking:{courier:'Blue Dart',id:'BD9847362',status:'In transit',expected:'2026-07-04'},date:'2026-06-29'},{id:'PR-2026-002',pi:'Prof. Sample PI',project:'Wearable Robotics Control',projectNo:'IITJ/R&D/WR-01',type:'Recurring (R)',item:'Force sensors',qty:6,unit:3200,vendor:'Omega Instruments',status:'Delivered',gem:'GeM',quotation:'quotation-sensors.pdf',receipt:'payment-receipt.pdf',certificate:'',tracking:{courier:'Delhivery',id:'DL7361829',status:'Delivered',expected:'2026-06-28'},date:'2026-06-20'}]};let current='dashboard';const $=s=>document.querySelector(s),money=n=>'₹'+Number(n).toLocaleString('en-IN'),save=()=>localStorage.setItem(KEY,JSON.stringify(data));function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}function pill(s){let c=s==='Delivered'||s==='Complete'?'green':s.includes('pending')||s==='Non-GeM'?'amber':'blue';return `<span class="pill ${c}">${s}</span>`}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));function show(p){current=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));({dashboard,purchase,documents,tracking,inventory}[p])()}function setRole(r){$('#roleLabel').textContent=r;toast(r==='Professor / PI'?'Professor access enabled: review and add inventory':'Role switched to '+r);if(current==='inventory')inventory()}
function dashboard(){let total=data.purchases.reduce((s,p)=>s+p.qty*p.unit,0),del=data.purchases.filter(p=>p.status==='Delivered').length;$('#app').innerHTML=`<section class="hero"><div><h1>Automatic Inventory System</h1><p>One purchase record. Every document, delivery update and stock entry connected.</p></div><button class="btn dark" onclick="show('purchase')">+ Start a purchase</button></section><div class="cards"><div class="card metric"><b>${data.purchases.length}</b><span>Purchase records</span></div><div class="card metric"><b>${money(total)}</b><span>Committed value</span></div><div class="card metric"><b>${data.purchases.filter(p=>p.tracking?.status!=='Delivered').length}</b><span>Active shipments</span></div><div class="card metric"><b>${del}</b><span>Added to inventory</span></div></div><section class="section grid2"><div class="card"><div class="head"><h2>Procurement flow</h2></div><div class="steps">${[['1','Enter components & quotation'],['2','Generate IITJ fund approval'],['3','Add Non-GeM certificate / receipt'],['4','Track shipment automatically'],['5','Delivery updates inventory']].map((x,i)=>`<div class="step"><div class="num">${x[0]}</div><div><h3>${x[1]}</h3><p>${i<2?'Ready for your input':'Connected to the same purchase record'}</p></div>${pill(i<2?'Complete':'Ready')}</div>`).join('')}</div></div><div class="card"><div class="head"><h2>Recent activity</h2></div>${data.purchases.map(p=>`<div class="step"><div class="num">${p.item[0]}</div><div><h3>${p.item}</h3><p>${p.id} · ${p.vendor} · ${money(p.qty*p.unit)}</p></div>${pill(p.status)}</div>`).join('')}</div></section>`}
function purchase(){let id='PR-'+new Date().getFullYear()+'-'+String(data.purchases.length+1).padStart(3,'0');$('#app').innerHTML=`<section class="hero"><div><h1>New procurement request</h1><p>Add the component and quotation. The system prepares fund approval and the remaining file.</p></div><b>${id}</b></section><div class="card"><div class="head"><h2>Project and component details</h2></div><div class="formgrid"><div class="field"><label>Name of PI *</label><input id="pi" placeholder="Professor / Principal Investigator"></div><div class="field"><label>Project title *</label><input id="project" value="Wearable Robotics Control"></div><div class="field"><label>R&D project no. *</label><input id="projectNo" placeholder="IITJ/R&D/..."></div><div class="field"><label>Item classification</label><select id="ptype"><option>Non Recurring (NR)</option><option>Recurring (R)</option></select></div><div class="field"><label>Component / item name *</label><input id="item" placeholder="e.g. BLDC motor"></div><div class="field"><label>Quantity *</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Estimated unit cost (inclusive of taxes) *</label><input id="unit" type="number" min="0" placeholder="₹"></div><div class="field"><label>Proposed vendor</label><input id="vendor" placeholder="Vendor name"></div><div class="field"><label>GeM status</label><select id="gem"><option>GeM</option><option>Non-GeM</option><option>To be checked</option></select></div><div class="field full"><label>Technical specification / purpose</label><textarea id="purpose" placeholder="Why this component is needed and the required specification"></textarea></div><div class="field full"><label>Upload quotation(s) *</label><label class="drop">Choose PDF/image quotation(s)<input id="quotation" type="file" accept=".pdf,image/*" multiple style="margin-top:8px"></label></div></div><div class="notice" style="margin-top:13px">The generated approval follows IIT Jodhpur Office of R&amp;D Form Acct/R&amp;D-01, including NR/R totals, committee composition and declarations.</div><div class="actions"><button class="btn" onclick="show('dashboard')">Cancel</button><button class="btn primary" onclick="createPurchase('${id}')">Save & generate fund approval</button></div></div>`}
function createPurchase(id){let req=['pi','project','projectNo','item','unit'];if(req.some(x=>!$('#'+x).value.trim()))return toast('Please complete all required fields');let f=$('#quotation').files;let p={id,pi:$('#pi').value,project:$('#project').value,projectNo:$('#projectNo').value,type:$('#ptype').value,item:$('#item').value,qty:+$('#qty').value||1,unit:+$('#unit').value,vendor:$('#vendor').value,gem:$('#gem').value,purpose:$('#purpose').value,quotation:[...f].map(x=>x.name).join(', ')||'Quotation to be uploaded',certificate:'',receipt:'',status:'Documents pending',tracking:null,date:new Date().toISOString().slice(0,10)};data.purchases.unshift(p);save();toast('Fund approval generated');show('documents')}
function documents(){let p=data.purchases[0];$('#app').innerHTML=`<div class="head"><h2>Document centre</h2><button class="btn green" onclick="downloadPack()">Download complete procurement pack</button></div><div class="tabs">${data.purchases.map((x,i)=>`<button class="btn ${i===0?'primary':''}" onclick="selectDoc(${i},this)">${x.id}</button>`).join('')}</div><div id="docHost"></div>`;renderDoc(p)}function selectDoc(i,b){document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');renderDoc(data.purchases[i])}function renderDoc(p){window.activeDoc=p;let nr=p.type.includes('Non'),amount=p.qty*p.unit;$('#docHost').innerHTML=`<div class="grid2"><div><div class="card"><div class="head"><h2>Supporting files</h2></div><p><b>Quotation:</b> ${p.quotation||'Pending'}</p><div class="field"><label>Non-GeM certificate</label><input type="file" onchange="attach('${p.id}','certificate',this)"></div><br><div class="field"><label>Payment receipt / invoice</label><input type="file" onchange="attach('${p.id}','receipt',this)"></div><div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div></div><div class="doc"><div class="dochead"><img src="logo.png"><b>Indian Institute of Technology Jodhpur</b><h3>Office of Research and Development</h3><small>Form No.: Acct/R&amp;D-01</small><h2>Fund Approval for Procurement</h2></div><table><tr><th>1</th><th>Name of PI</th><td colspan="3">${p.pi}</td></tr><tr><th>2</th><th>Project Title</th><td colspan="3">${p.project}</td></tr><tr><th>3</th><th>R&amp;D Project No.</th><td colspan="3">${p.projectNo}</td></tr><tr><th colspan="5">List of Items</th></tr><tr><th>Category</th><th>Item name</th><th>Quantity</th><th colspan="2">Estimated cost (inclusive of all taxes and charges)</th></tr><tr><td>${p.type}</td><td>${p.item}</td><td>${p.qty}</td><td colspan="2">${money(amount)}</td></tr><tr><th colspan="3">Total (NR)</th><td colspan="2">${nr?money(amount):money(0)}</td></tr><tr><th colspan="3">Total (R)</th><td colspan="2">${nr?money(0):money(amount)}</td></tr><tr><th colspan="3">Total (NR + R)</th><th colspan="2">${money(amount)}</th></tr></table><p><b>Committee composition:</b> Procurement for items costing above Rs. 2,00,000/-: Member I, Member II, Member III. For procurement above Rs. 2.5 Lakhs: AR/DR SPS and AR/DR R&amp;D in addition.</p><p><b>Declaration:</b> Consent has been taken from PFC members; proposed items are in line with the sanctioned funding order; procurement will follow Institute rules.</p><p><b>Pre-audit note:</b> Required for purchase files above Rs. 10 Lakh and PAC / Single Tender Enquiry cases, irrespective of amount.</p><p><b>Submitted for Fund Approval for procurement of items as mentioned above.</b></p><div class="sig"><div>Principal Investigator</div><div>Head / PFC</div><div>R&amp;D / Finance Approval</div></div></div></div>`}
function attach(id,k,el){let p=data.purchases.find(x=>x.id===id);p[k]=el.files[0]?.name||'';if(p.receipt&&(p.certificate||p.gem==='GeM'))p.status='Ready to close';save();toast('File attached to '+id)}function downloadPack(){let p=window.activeDoc||data.purchases[0],content=`WEROCON LAB — PROCUREMENT FILE\n${p.id}\n\nPI: ${p.pi}\nProject: ${p.project}\nProject No: ${p.projectNo}\nItem: ${p.item}\nQuantity: ${p.qty}\nTotal: ${money(p.qty*p.unit)}\nQuotation: ${p.quotation}\nNon-GeM certificate: ${p.certificate||'Not applicable / pending'}\nPayment receipt: ${p.receipt||'Pending'}\nTracking: ${p.tracking?p.tracking.courier+' '+p.tracking.id+' — '+p.tracking.status:'Not added'}\n\nThis manifest accompanies the generated IITJ R&D fund approval and uploaded supporting documents.`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.download=p.id+'-complete-procurement-pack.txt';a.click();toast('Complete pack downloaded')}
function tracking(){let rows=data.purchases.map(p=>`<tr><td><b>${p.item}</b><br>${p.id}</td><td>${p.tracking?.courier||'—'}</td><td>${p.tracking?.id||'—'}</td><td>${pill(p.tracking?.status||'Not added')}</td><td>${p.tracking?.expected||'—'}</td><td><button class="btn" onclick="openTrack('${p.id}')">${p.tracking?'Update':'Add tracking'}</button></td></tr>`).join('');$('#app').innerHTML=`<section class="hero"><div><h1>Shipment auto-tracking</h1><p>Keep courier references and delivery status linked to each purchase.</p></div><button class="btn dark" onclick="openTrack('${data.purchases[0]?.id}')">+ Add tracking</button></section><div class="notice">Browser-only prototype: statuses can be recorded and updated here. Live courier refresh on GitHub Pages requires a secure tracking API/backend connection.</div><div class="tablewrap section"><table><thead><tr><th>Purchase</th><th>Courier</th><th>Tracking ID</th><th>Status</th><th>Expected</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}function openTrack(id){$('#trackPurchase').innerHTML=data.purchases.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${p.id} — ${p.item}</option>`).join('');let p=data.purchases.find(x=>x.id===id);if(p?.tracking){$('#courier').value=p.tracking.courier;$('#trackingId').value=p.tracking.id;$('#trackStatus').value=p.tracking.status;$('#expected').value=p.tracking.expected}$('#trackModal').classList.add('open')}function closeTrack(){$('#trackModal').classList.remove('open')}function saveTrack(){let p=data.purchases.find(x=>x.id===$('#trackPurchase').value);if(!$('#trackingId').value)return toast('Enter a tracking ID');p.tracking={courier:$('#courier').value,id:$('#trackingId').value,status:$('#trackStatus').value,expected:$('#expected').value};if(p.tracking.status==='Delivered')p.status='Delivered';save();closeTrack();toast(p.tracking.status==='Delivered'?'Delivered and inventory updated':'Tracking updated');tracking()}
function inventory(){let professor=$('#role').value==='Professor / PI';$('#app').innerHTML=`<div class="head"><h2>Lab inventory</h2><div><span class="pill blue">${$('#role').value}</span> <button class="btn primary" onclick="show('purchase')">+ Add inventory input</button></div></div><div class="notice">${professor?'Professor access is active. You can enter components and review delivery records.':'Inventory is updated automatically when a tracked shipment is marked Delivered.'}</div><div class="tablewrap section"><table><thead><tr><th>Asset / Component</th><th>Project</th><th>Qty</th><th>Vendor</th><th>Invoice value</th><th>Acquired</th><th>Stock status</th></tr></thead><tbody>${data.purchases.map(p=>`<tr><td><b>${p.item}</b><br>${p.id}</td><td>${p.project}</td><td>${p.qty}</td><td>${p.vendor||'—'}</td><td>${money(p.qty*p.unit)}</td><td>${p.date}</td><td>${pill(p.status==='Delivered'?'In stock':'Expected')}</td></tr>`).join('')}</tbody></table></div>`}show('dashboard');
</script>
<script>
/* Requested lab-specific workflow overrides */
document.querySelector('.rolebar').innerHTML='<span id="roleLabel">Vedant</span><select id="role" onchange="setRole(this.value)"><option>Vedant — Lab administrator</option><option>Dr. Saurav Kumar — Professor / PI</option><option>Inventory manager</option></select><img class="avatar" src="vedant.png" alt="Vedant profile photo">';
data.purchases.forEach(p=>{p.pi='Dr. Saurav Kumar';p.requester=p.requester||'Vedant';p.paymentStatus=p.paymentStatus||'Pending';p.paymentMethod=p.paymentMethod||'Not selected';p.remarks=p.remarks||'';p.reimbursement=p.reimbursement||false;p.po=p.po||''});save();
dashboard=function(){let total=data.purchases.reduce((s,p)=>s+p.qty*p.unit,0);$('#app').innerHTML=`<section class="hero"><div><h1>Automatic Inventory System</h1><p>First enter the component, then follow its live procurement status.</p></div><button class="btn dark" onclick="show('purchase')">+ Enter component</button></section><div class="cards"><div class="card metric"><b>${data.purchases.length}</b><span>Components entered</span></div><div class="card metric"><b>${money(total)}</b><span>Procurement value</span></div><div class="card metric"><b>${data.purchases.filter(p=>p.paymentStatus==='Paid').length}</b><span>Payments completed</span></div><div class="card metric"><b>${data.purchases.filter(p=>p.status==='Delivered').length}</b><span>Inventory updated</span></div></div><section class="section"><div class="head"><h2>Component procurement status</h2></div><div class="steps">${data.purchases.map((p,i)=>`<div class="step"><div class="num">${i+1}</div><div><h3>${p.item}</h3><p>${p.id} · Quotation: ${p.quotation?'uploaded':'pending'} · ${p.gem} · Payment: ${p.paymentStatus} · Shipment: ${p.tracking?.status||'not added'}</p></div>${pill(p.status)}</div>`).join('')}</div></section>`};

ld full"><label>Remarks</label><textarea id="remarks" placeholder="Specifications, payment or procurement remarks"></textarea></div><div class="field full"><label>Quotation *</label><label class="drop">Upload quotation PDF/image<input id="quotation" type="file" accept=".pdf,image/*" multiple style="margin-top:8px"></label></div></div><div class="actions"><button class="btn" onclick="show('dashboard')">Cancel</button><button class="btn primary" onclick="createPurchase2('${id}')">Save component & show status</button></div></div>`};

renderDoc=function(p){window.activeDoc=p;let nr=p.type.includes('Non'),amount=p.qty*p.unit,paid=p.paymentStatus==='Paid',needPO=!paid;$('#docHost').innerHTML=`<div class="grid2"><div><div class="card"><div class="head"><h2>Supporting files required</h2></div><div class="field"><label>1. Quotation *</label><input type="file" onchange="attach('${p.id}','quotation',this)"><small>${p.quotation||'Pending'}</small></div><br>${p.gem==='Non-GeM'?`<div class="field"><label>2. Non-GeM certificate *</label><input type="file" onchange="attach('${p.id}','certificate',this)"><small>${p.certificate||'Pending'}</small></div><br>`:''}${paid?`<div class="field"><label>3. Payment receipt *</label><input type="file" onchange="attach('${p.id}','receipt',this)"><small>${p.receipt||'Pending'}</small></div>`:`<div class="field"><label>3. Purchase Order (payment not completed) *</label><input type="file" onchange="attach('${p.id}','po',this)"><small>${p.po||'Pending'}</small></div>`}<div class="checkrow"><label><input type="checkbox" ${p.reimbursement?'checked':''} onchange="markOption('${p.id}','reimbursement',this.checked)"> Applied for reimbursement</label><label><input type="checkbox" ${p.paymentStatus==='Pending'?'checked':''} onchange="markPending('${p.id}',this.checked)"> Payment pending</label></div><p><b>Payment:</b> ${p.paymentStatus} · ${p.paymentMethod}</p><p><b>Remarks:</b> ${p.remarks||'—'}</p><a class="btn" href="Fund-Approval-Original-Format.docx" download>Download original IITJ template</a><button class="btn" onclick="window.print()">Print filled form</button></div></div><div class="doc exact-form"><div class="dochead"><b>Indian Institute of Technology Jodhpur</b><h3>Office of Research and Development</h3><small>Form No.: Acct/R&amp;D-01</small><h2>Fund Approval for Procurement</h2></div><table><tr><td>1</td><td>Name of PI</td><td colspan="3">${p.pi}</td></tr><tr><td>2</td><td>Project Title</td><td colspan="3">${p.project}</td></tr><tr><td>3</td><td>R&amp;D Project No.</td><td colspan="3">${p.projectNo}</td></tr><tr><th colspan="5">Lists of Items</th></tr><tr><td rowspan="3">Non Recurring Items (NR)</td><td colspan="2">Item Name</td><td>Quantity</td><td>Estimated Cost (Inclusive of all taxes and charges)</td></tr><tr><td colspan="2">${nr?p.item:''}</td><td>${nr?p.qty:''}</td><td>${nr?money(amount):''}</td></tr><tr><td colspan="3">Total (NR)</td><td>${nr?money(amount):money(0)}</td></tr><tr><td rowspan="3">Recurring Items (R)<br>{Consumable/Contingency/Travel/Miscellaneous/Any other please specify}</td><td colspan="2">Recurring items of the project</td><td></td><td></td></tr><tr><td colspan="2">${nr?'':p.item}</td><td>${nr?'':p.qty}</td><td>${nr?'':money(amount)}</td></tr><tr><td colspan="3">Total (R)</td><td>${nr?money(0):money(amount)}</td></tr><tr><th colspan="4">Total (NR+R)</th><th>${money(amount)}</th></tr><tr><td colspan="5"><b>Committee composition:</b><br>Procurement for items costing above Rs. 2,00,000/- (below committee)<br>Member I: &nbsp;&nbsp; Member II: &nbsp;&nbsp; Member III:<br><br>Procurement for items costing above Rs. 2.5 Lakhs (the following members in addition to above three members as mentioned in A)<br>AR/ DR SPS &nbsp;&nbsp; AR/ DR R&amp;D<br><br><b>Declaration:</b><br>a) I have taken consent from all members of PFC.<br>b) Proposed items of procurement are in line with the sanctioned order of the funding agency.<br>c) Procurements will be made as per the Institute procurement rules.<br><br><b>Note:</b> As per Circular no. IITJ/RIG/2024-25/270 dated 12 February 2025, Pre Audit is required in the following purchase cases:<br>Pre-Audit of Purchase file above Rs. 10 Lakh;<br>Pre-Audit of purchase files relating to Proprietary Article Certificate (PAC) / Single Tender Enquiry, irrespective of amount.</td></tr><tr><td colspan="5"><b>Submitted for Fund Approval for procurement of items as mentioned above.</b></td></tr></table></div></div>`};
function markOption(id,k,v){data.purchases.find(p=>p.id===id)[k]=v;save();toast('Reimbursement option updated')}function markPending(id,v){let p=data.purchases.find(p=>p.id===id);p.paymentStatus=v?'Pending':'Paid';save();renderDoc(p)}

inventory=function(){let role=$('#role').value;$('#app').innerHTML=`<div class="head"><h2>Editable lab inventory</h2><div><span class="pill blue">${role}</span> <button class="btn primary" onclick="show('purchase')">+ Add component</button></div></div><div class="notice">Edit component details, payment status, payment method and remarks directly below. Changes are saved automatically.</div><div class="tablewrap section"><table><thead><tr><th>Component</th><th>Qty</th><th>Vendor</th><th>Unit price</th><th>Payment status</th><th>Payment method</th><th>Remarks</th><th>Stock</th></tr></thead><tbody>${data.purchases.map(p=>`<tr><td><input class="editinput" value="${p.item}" onchange="updateField('${p.id}','item',this.value)"><br><small>${p.id}</small></td><td><input class="editinput" type="number" value="${p.qty}" onchange="updateField('${p.id}','qty',this.value)"></td><td><input class="editinput" value="${p.vendor||''}" onchange="updateField('${p.id}','vendor',this.value)"></td><td><input class="editinput" type="number" value="${p.unit}" onchange="updateField('${p.id}','unit',this.value)"></td><td><select class="editinput" onchange="updateField('${p.id}','paymentStatus',this.value)">${['Pending','Paid','PO raised','Reimbursement applied'].map(x=>`<option ${p.paymentStatus===x?'selected':''}>${x}</option>`).join('')}</select></td><td><select class="editinput" onchange="updateField('${p.id}','paymentMethod',this.value)">${['Not selected','UPI','Bank transfer / NEFT','Credit / debit card','Cash','Purchase Order','Reimbursement'].map(x=>`<option ${p.paymentMethod===x?'selected':''}>${x}</option>`).join('')}</select></td><td><textarea class="editinput" onchange="updateField('${p.id}','remarks',this.value)">${p.remarks||''}</textarea></td><td>${pill(p.status==='Delivered'?'In stock':'Expected')}</td></tr>`).join('')}</tbody></table></div>`};
show('dashboard');
</script>

<script>
let sauravProfileUnlocked=false;
switchProfile=function(v){sauravProfileUnlocked=false;let s=v==='saurav';$('#roleLabel').textContent=s?'Dr. Saurav Kumar — Incharge':'Vedant — Website Manager';$('#profileAvatar').src=s?'logo.png':'vedant.jpg';$('#profileAvatar').alt=s?'Locked Dr. Saurav Kumar profile':'Open Vedant profile';$('#profileAvatar').title=s?'Password required':'Open profile';let modal=document.getElementById('profileModal');if(modal)modal.remove();toast(s?'Dr. Saurav Kumar profile is locked':'Vedant profile selected')}
openProfile=function(){let s=$('#role').value==='saurav',old=document.getElementById('profileModal');if(old)old.remove();if(s)sauravProfileUnlocked=false;let m=document.createElement('div');m.id='profileModal';m.className='modal open';m.innerHTML=s?`<div class="modalbox" style="max-width:430px;text-align:center"><img src="logo.png" style="width:92px;height:92px;object-fit:contain"><h2 style="margin:14px 0 4px">Protected profile</h2><p style="color:var(--muted)">Password required to view this profile.</p><input id="sauravProfilePassword" type="password" placeholder="Profile password" autocomplete="off" style="width:100%;border:1px solid #dfe3eb;border-radius:8px;padding:10px" onkeydown="if(event.key==='Enter')unlockSauravProfile()"><div id="profilePasswordError" style="color:#b42318;font-size:12px;margin-top:7px"></div><div class="actions"><button class="btn" onclick="closeProfileSecure()">Cancel</button><button class="btn primary" onclick="unlockSauravProfile()">Open profile</button></div></div>`:`<div class="modalbox" style="max-width:430px;text-align:center"><img src="vedant.jpg" style="width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #e8ecff"><h2 style="margin:14px 0 4px">Vedant</h2><p style="color:var(--muted)">Website Manager</p><p>Manages the WeRoCon procurement website and purchase records.</p><button class="btn primary" onclick="closeProfileSecure()">Close profile</button></div>`;document.body.appendChild(m)}
function closeProfileSecure(){sauravProfileUnlocked=false;let m=document.getElementById('profileModal');if(m)m.remove()}
unlockSauravProfile=function(){let field=document.getElementById('sauravProfilePassword');if(!field||field.value!=='Sauravk'){let e=document.getElementById('profilePasswordError');if(e)e.textContent='Incorrect password.';return}sauravProfileUnlocked=true;document.getElementById('profileModal').innerHTML=`<div class="modalbox" style="max-width:430px;text-align:center"><img src="saurav.png" style="width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #e8ecff"><h2 style="margin:14px 0 4px">Dr. Saurav Kumar</h2><p style="color:var(--muted)">WeRoCon Lab Incharge</p><p>Principal Investigator and procurement/inventory approver.</p><button class="btn primary" onclick="closeProfileSecure()">Close profile</button></div>`}
switchProfile($('#role').value);
</script>
<script>
let sauravSession=false;
function showSauravSwitchLogin(){let old=document.getElementById('profileModal');if(old)old.remove();let m=document.createElement('div');m.id='profileModal';m.className='modal open';m.innerHTML=`<div class="modalbox" style="max-width:430px;text-align:center"><img src="saurav.png" style="width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid #e8ecff"><h2 style="margin:14px 0 4px">Switch to Dr. Saurav Kumar</h2><p style="color:var(--muted)">Enter the password to continue as WeRoCon Lab Incharge.</p><input id="sauravSwitchPassword" type="password" placeholder="Password" autocomplete="off" style="width:100%;border:1px solid #dfe3eb;border-radius:8px;padding:10px" onkeydown="if(event.key==='Enter')completeSauravSwitch()"><div id="switchPasswordError" style="color:#b42318;font-size:12px;margin-top:7px"></div><div class="actions"><button class="btn" onclick="cancelSauravSwitch()">Cancel</button><button class="btn primary" onclick="completeSauravSwitch()">Switch profile</button></div></div>`;document.body.appendChild(m)}
switchProfile=function(v){if(v==='saurav'&&!sauravSession){$('#role').value='vedant';showSauravSwitchLogin();return}let s=v==='saurav';$('#roleLabel').textContent=s?'Dr. Saurav Kumar — Incharge':'Vedant — Website Manager';$('#profileAvatar').src=s?'saurav.png':'vedant.jpg';$('#profileAvatar').alt=s?'Open Dr. Saurav Kumar profile':'Open Vedant profile';$('#profileAvatar').title='Open profile';let modal=document.getElementById('profileModal');if(modal)modal.remove();toast((s?'Dr. Saurav Kumar':'Vedant')+' profile selected')}
function completeSauravSwitch(){let f=document.getElementById('sauravSwitchPassword');if(!f||f.value!=='Sauravk'){document.getElementById('switchPasswordError').textContent='Incorrect password.';return}sauravSession=true;$('#role').value='saurav';switchProfile('saurav')}
function cancelSauravSwitch(){$('#role').value='vedant';sauravSession=false;let m=document.getElementById('profileModal');if(m)m.remove()}
openProfile=function(){let s=$('#role').value==='saurav',old=document.getElementById('profileModal');if(old)old.remove();let m=document.createElement('div');m.id='profileModal';m.className='modal open';m.innerHTML=`<div class="modalbox" style="max-width:430px;text-align:center"><img src="${s?'saurav.png':'vedant.jpg'}" style="width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #e8ecff"><h2 style="margin:14px 0 4px">${s?'Dr. Saurav Kumar':'Vedant'}</h2><p style="color:var(--muted)">${s?'WeRoCon Lab Incharge':'Website Manager'}</p><p>${s?'Principal Investigator and procurement/inventory approver.':'Manages the WeRoCon procurement website and purchase records.'}</p><button class="btn primary" onclick="document.getElementById('profileModal').remove()">Close profile</button></div>`;document.body.appendChild(m)}
let documentsBeforeDelete=documents;documents=function(){documentsBeforeDelete();let h=document.querySelector('#app .head');if(h&&data.purchases.length){let b=document.createElement('button');b.className='btn';b.style.color='#b42318';b.textContent='Delete selected procurement';b.onclick=()=>deleteSelectedProcurement();h.appendChild(b)}}
function deleteSelectedProcurement(){let p=window.activeDoc||data.purchases[0];if(!p)return;if(!confirm('Delete '+p.id+' and all its linked records?'))return;data.purchases=data.purchases.filter(x=>x.id!==p.id);save();window.activeDoc=data.purchases[0]||null;toast('Procurement deleted');documents()}
window.addEventListener('load',()=>{sauravSession=false;$('#role').value='vedant';$('#roleLabel').textContent='Vedant — Website Manager';$('#profileAvatar').src='vedant.jpg';$('#profileAvatar').alt='Open Vedant profile'});
</script></body></html>
